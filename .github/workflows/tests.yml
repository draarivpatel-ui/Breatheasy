name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from Oct 19, 2026 (actions/runner-images#14748)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test                     # unit tests (node --test tests/*.test.js)
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - run: python tests/e2e.py          # headless Chromium, APIs answered from tests/fixtures (deterministic)
      - run: sudo apt-get install -y poppler-utils   # pdfinfo/pdftotext for the print check
      - run: python tests/print_test.py   # Print plan: one Letter page EN/ES (plain, SYNTHETIC demo, long personal plan)
      - run: python tests/axe_states.py   # axe-core: 11 states x 390/1280 x EN/ES, plus a language switch mid-flow
      - run: python tests/axe_baseline.py # axe-core WCAG 2.2 AA (incl. target-size) at 360/1280: no NEW serious/critical vs the Oct 12 audit baseline
      - run: python tests/lang_flash.py   # Spanish users never see the English page flash; 3 s fail-safe
      - run: python tests/edge.py         # impossible peak flow / personal best / future dates refused; messages follow a language switch
      - run: python tests/saved_state.py  # broken saved data / impossible ?today= never stop the page loading
